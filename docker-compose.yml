services:
  postgres:
    image: postgres:16
    container_name: sait_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db
    ports:
      - "5434:5432"
    volumes:
      - sait_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sait_qdrant
    restart: always
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - sait_qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: sait_llama_swap
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./models:/models
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build: .
    container_name: sait_fastapi_app
    restart: always
    ports:
      - "8083:8001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLAMA_SWAP_HOST=http://llama-swap:8080
      - LLM_MODEL=qwen2:1.5b
      - API_KEY=
    volumes:
      - sait_upload_data:/app/uploads
      - sait_hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      llama-swap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4.0"

  frontend:
    image: nginx:alpine
    container_name: sait_frontend
    restart: always
    ports:
      - "3006:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fastapi:
        condition: service_healthy

volumes:
  sait_postgres_data:
  sait_qdrant_data:
  sait_upload_data:
  sait_open_webui:
  sait_hf_cache:
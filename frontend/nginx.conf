server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the page shell or assets — updates show instantly
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;

    location / {
        try_files $uri $uri/ /index.html;
    }
}